name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-latest, cc: gcc }
          - { name: linux-clang, os: ubuntu-latest, cc: clang }
          - { name: macos-clang, os: macos-latest,  cc: clang }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_C_COMPILER=${{ matrix.cc }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: linux-asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_C_COMPILER=clang -DASTOOLS_SANITIZERS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  rename-lint:
    # D16: the old project slug must not reappear anywhere.
    name: legacy-slug-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep for the legacy slug
        run: |
          # Bracketed pattern so this workflow file never matches itself.
          if grep -riE --exclude-dir=.git --exclude-dir=deps -n "ast[l]s" .; then
            echo "D16 violation: legacy project slug found" >&2
            exit 1
          fi
